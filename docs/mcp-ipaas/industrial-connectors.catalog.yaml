statusPolicy: >-
  The supplied table is discovery input. reported-unverified and gap are not
  production trust decisions. Every candidate must pass the blueprint intake gates.

waves:
  foundation: Platform gateway, policy, audit, secret broker, and edge runtime.
  pilot: One local CAD connector with read-only tools, export-copy, and one governed mutation.
  expansion: Qualify more reported MCPs plus one CAE job and one enterprise API connector.
  discovery: Build or source connectors for stated gaps after official API and license review.

